# =====================================================================
#  ResetTools 任务配置
#  流程：到达设定时间 -> 把目标世界中的玩家传送走
#        -> 异步按顺序执行 command
#        -> 全部执行完后再等待 delay-command.time，执行 delay-command.command
#  世界的卸载/删除/重建交给 Multiverse 等插件，通过 command 完成：
#      /mvunload <世界>  卸载世界
#      /mvdelete <世界>  删除世界（可选，由其他插件实现）
#  修改后执行 /resettools reload 生效
# =====================================================================

# ---------------- 全局设置 ----------------
settings:
  # 命令之间的执行间隔（秒），默认 3 秒
  command-interval: 3
  # 传送玩家时是否给玩家发送提示（任务中写了 message 时以任务为准）
  notify-player: true

# ---------------- 任务 ----------------
# 每个任务用一个独立 id（顶级键名），可以配置多个任务。
# 同一任务在同一天只触发一次；服务器在该时刻未运行则本次跳过。
task_example:
  # 是否启用
  enabled: false
  # 星期几：1-7 代表周一到周日，也可写成列表 weekdays: [ 1, 3, 5 ]
  weekday: 1
  # 执行时间，24 小时制 HH:mm（服务器所在时区）
  time: "04:00"
  # 需要清空玩家并重置的世界 id（Bukkit 世界名）
  worldid: world_nether
  # 传送目标；不写 x/y/z 时使用目标世界的出生点
  teleport:
    world: world
    x: 0.5
    y: 65
    z: 0.5
    yaw: 0
    pitch: 0
    # 可选：自定义提示，支持 &颜色 及占位符 {world} {task} {time} {seconds} {players}
    message: "&e世界 &f{world} &e即将重置，你已被传送至安全区域"
  # 按序号依次执行的命令（不写开头的 / 也可以），间隔 settings.command-interval 秒
  # 全部在异步线程执行，不占用服务器主线程
  command:
    '1': '/mvunload world_nether'
    '2': '/customcommand'
  # command 全部执行完毕后再延迟执行的一组命令
  delay-command:
    # 延迟时长，单位 s/m/h/d，默认 0（可用 30s、5m、2h、1d）
    time: 5m
    command:
      '1': '/say 世界 &f{world} &e已重置完成'
  # 可选：执行前的广播提醒（键为提前秒数，值为提示内容）
  warnings:
    '300': '&c世界 &f{world} &c将在 5 分钟后重置'
    '60': '&c世界 &f{world} &c将在 1 分钟后重置'
    '10': '&c世界 &f{world} &c将在 10 秒后重置，请立即离开'
