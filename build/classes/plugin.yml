name: ResetTools
version: '1.0'
main: ns.toolboxes.resettools.ResetTools
api-version: '1.20'
description: 定时把玩家传送出指定世界，然后重置该世界或执行命令
author: [ NSrank, DeepSeek ]
website: https://github.com/NSrank/ResetTools
commands:
  resettools:
    description: ResetTools 管理命令
    usage: /resettools <reload|list|next|run <id>>
    aliases: [ rt ]
    permission: resettools.admin
permissions:
  resettools.admin:
    description: 允许管理 ResetTools
    default: op
